<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to XYZ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container d-flex align-items-center justify-content-center" style="height: 100vh;">
        <div class="card p-4 shadow-lg" style="width: 100%; max-width: 400px;">
            <h3 class="text-center mb-4" style="color: #0056b3;">Login</h3>
            
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" placeholder="Enter your username" required>
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
            </div>

            <div id="error-message" class="text-danger text-center">
                Captcha Verification failed!
                <img src="{{url_for('static', filename='images/captcha.png')}}" width="70px" height="70px">
            </div>

            <button id="login-btn" type="button" class="btn btn-danger w-100">Login</button>
        </div>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        $(document).ready(function () {
            $('#login-btn').on('click', function () {
                var username = $('#username').val();
                var password = $('#password').val();
                var redirectUrl = getQueryParam('redirectUrl');

                $.ajax({
                    url: '/login',
                    type: 'POST',
                    data: JSON.stringify({ Username: username, Password: password, ReturnUrl: redirectUrl }),
                    contentType: 'application/json',
                    success: function (response) {
                        window.location.href = "http://localhost:5187/vulnerable/openredirect/profile";
                    },
                    error: function () {
                        $('#error-message').text('An error occurred. Please try again.');
                    }
                });
            });
        });

        function getQueryParam(param) {
            let urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }
    </script>
</body>
</html>
